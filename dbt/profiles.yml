ecommerce_analytics:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    databricks:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'ecommerce') }}"
      schema: analytics
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 8
    local_spark:
      type: spark
      method: thrift
      host: "{{ env_var('SPARK_THRIFT_HOST', 'spark-thrift') }}"
      port: "{{ env_var('SPARK_THRIFT_PORT', '10000') | int }}"
      user: dbt
      schema: analytics
      threads: 4
      connect_retries: 10
      connect_timeout: 30
      retry_all: true
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'ecommerce') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'ecommerce') }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'warehouse') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
