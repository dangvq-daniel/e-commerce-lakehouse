name: ecommerce_analytics
version: 1.0.0
config-version: 2

profile: ecommerce_analytics

model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  ecommerce_analytics:
    staging:
      +materialized: view
      +schema: staging
      +file_format: delta
    intermediate:
      +materialized: view
      +schema: intermediate
      +file_format: delta
    marts:
      +materialized: table
      +schema: gold
      +file_format: delta

snapshots:
  ecommerce_analytics:
    +target_schema: snapshots
